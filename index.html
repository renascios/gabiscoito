<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400..700&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Arimo:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
        <title>Gabiscoito</title>
    </head>
    <body>
        <header>
            <img src="imagens/logo.png" alt="logo Gabiscoito">
            <nav>
                <a href="">Início</a>
                <a href="">Cardápio</a>
                <a href="">Sobre</a>
                <a href="">Contato</a>
            </nav>
        </header>
        <picture>
        </picture>
        <h2 class="cardapio">Cardápio</h2>
        <hr>
        <div id="filtros">
            <button class="botao-filtro" data-categoria="todos">Todos</button>
            <button class="botao-filtro" data-categoria="salgados">Salgados</button>
            <button class="botao-filtro" data-categoria="doces">Doces</button>
        </div>
        <div id="produtos">
        </div>
        <main>
            <section>
                <h2>Quem Somos Nós ?</h2>
                <p>Seja bem vindo a Gabiscoito !<br></p>
                <p>Somos duas irmãs que amam cozinhar e resolvemos compartilhar um pouco desse amor com vocês !<br></p>
                <p>Somos especializadas em docinhos e salgadinhos para festas !</p>
            </section>
        </main>
        <div id="carrinho-lista">
            <button id="botao-carrinho"><img src="imagens/carrinho.png" alt="carrinho de compras"></button>
        </div>
        <div id="overlay" class="oculto">
                <div id="lista"></div>
                <button id="fechar"><img src="imagens/fechar.png" alt="botao fechar"></button>
        </div>

        <footer>
            <p>Informações de contato:</p>
            <a href="">Instagram</a>
            <a href="">Whatsapp</a>
        </footer>
        <script src="js/script.js"></script>
    </body>
</html>
